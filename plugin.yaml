# Hermes agent-plugin manifest.
#
# The web dashboard discovers this plugin via dashboard/manifest.json; this
# file exists so the panel's "Install from GitHub" pins the install folder
# name. The layout backend (dashboard/plugin_api.py) persists to
# ~/.hermes/plugins/home-dashboard/layout.json, so the folder MUST be named
# "home-dashboard" regardless of the GitHub repo name — that's what `name`
# below guarantees.
name: home-dashboard
label: Home
description: Personalizable rice-style Home page with draggable, resizable widgets and Boards, an infinite canvas Hermes draws on with you, with live cards bound to your running jobs, for Hermes Web and Desktop.
version: 1.10.1
manifest_version: 1
# Oldest Hermes with a field report (Desktop 0.21.5, issue #3); the backend
# adapters also cover hosts that predate the web_routers split.
requires_hermes: ">=0.21.5"
# Boards: the agent reads and writes the user's boards, and linked sessions hear
# what the user changed between turns.
provides_tools:
  - board_read
  - board_apply
  - board_render
  - board_component
provides_hooks:
  - pre_llm_call
